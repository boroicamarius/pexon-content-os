[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pexon"
version = "0.2.0"
description = "Pexon Content OS — closed-loop content operating system for German bank AI consulting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Pexon" }]
keywords = ["langgraph", "content-marketing", "geo", "seo", "german-banks", "ai-governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint>=4.0",
  "langgraph-checkpoint-sqlite>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "openai>=1.50,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "langdetect>=1.0.9,<2",
  "scikit-learn>=1.5,<2",
  "trafilatura>=1.10,<3",
  "langsmith>=0.1,<1",
]

[project.optional-dependencies]
providers = [
  "langchain-openai>=0.3,<2",
  "anthropic>=0.40,<1",
  "google-genai>=1.0,<2",
  "ddgs>=9.0,<10",
  "tavily-python>=0.5,<1",
  "sentence-transformers>=3.0,<6",
  "google-auth>=2.30,<3",
  "redis>=5.0,<7",
  "playwright>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
pexon = "pexon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pexon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501"]
