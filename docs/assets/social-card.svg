<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#0FB5A6"/>
    </linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .brand { font-family: Inter, SF Pro Display, Segoe UI, sans-serif; font-size: 78px; font-weight: 800; letter-spacing: -3px; fill: #FFFFFF; }
      .h { font-family: Inter, SF Pro Display, Segoe UI, sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -1.4px; fill: #FFFFFF; }
      .s { font-family: Inter, Segoe UI, sans-serif; font-size: 19px; fill: #AEB8D0; }
      .chip { font-family: Inter, Segoe UI, sans-serif; font-size: 15px; font-weight: 700; fill: #DCE4FF; }
      .tiny { font-family: Inter, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #7F8AA5; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#g)"/>
  <circle cx="1110" cy="80" r="240" fill="#2F6BFF" opacity="0.12"/>
  <circle cx="1180" cy="560" r="180" fill="#0FB5A6" opacity="0.08"/>
  <rect x="64" y="64" width="72" height="72" rx="20" fill="url(#accent)"/>
  <text x="100" y="116" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">P</text>
  <text x="160" y="112" class="brand">Pexon</text>
  <text x="64" y="190" class="h">Turn German bank AI content</text>
  <text x="64" y="242" class="h">into qualified pipeline.</text>
  <text x="64" y="286" class="s">Research → Intelligence → Generation → Reflection.</text>
  <text x="64" y="316" class="s">Then measure SEO, AI citations, leads and unit economics.</text>

  <g>
    <rect x="64" y="372" width="248" height="52" rx="26" fill="#162238" stroke="#27344F"/>
    <text x="188" y="404" text-anchor="middle" class="chip">RESEARCH</text>
    <rect x="332" y="372" width="270" height="52" rx="26" fill="#162238" stroke="#27344F"/>
    <text x="467" y="404" text-anchor="middle" class="chip">INTELLIGENCE</text>
    <rect x="622" y="372" width="260" height="52" rx="26" fill="#162238" stroke="#27344F"/>
    <text x="752" y="404" text-anchor="middle" class="chip">GENERATION</text>
    <rect x="902" y="372" width="260" height="52" rx="26" fill="#162238" stroke="#27344F"/>
    <text x="1032" y="404" text-anchor="middle" class="chip">REFLECTION</text>
  </g>

  <rect x="64" y="470" width="1098" height="2" fill="#FFFFFF" opacity="0.12"/>
  <text x="64" y="518" class="tiny">EVIDENCE PLANE</text>
  <text x="64" y="552" class="s">GSC · CRM · real GEO engines · cost per lead · cost per client</text>
  <text x="64" y="596" class="tiny">NO FABRICATED ANALYTICS · NO FABRICATED GEO · PROVIDER-INDEPENDENT</text>
  <rect x="1162" y="470" width="54" height="126" rx="10" fill="url(#accent)" opacity="0.9"/>
</svg>
